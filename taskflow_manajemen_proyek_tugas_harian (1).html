<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow — Manajemen Proyek & Tugas</title>
  <style>
    :root {
      --bg: #f4f6f9; --surface: #ffffff; --subtle: #f8fafc; --hover: #f1f5f9;
      --text: #0f172a; --muted: #64748b; --border: #e2e8f0;
      --primary: #4f46e5; --primary-soft: rgba(79,70,229,.1);
      --ok: #10b981; --ok-soft: rgba(16,185,129,.12);
      --warn: #f59e0b; --warn-soft: rgba(245,158,11,.14);
      --err: #ef4444; --err-soft: rgba(239,68,68,.12);
      --info: #0ea5e9; --info-soft: rgba(14,165,233,.12);
      --radius: 10px; --shadow: 0 4px 14px rgba(15,23,42,.06);
    }
    [data-theme="dark"] {
      --bg: #0b1120; --surface: #111827; --subtle: #1e293b; --hover: #263349;
      --text: #f8fafc; --muted: #94a3b8; --border: #1e293b;
      --primary: #6366f1; --primary-soft: rgba(99,102,241,.16);
      --ok: #34d399; --ok-soft: rgba(52,211,153,.15);
      --warn: #fbbf24; --warn-soft: rgba(251,191,36,.15);
      --err: #f87171; --err-soft: rgba(248,113,113,.16);
      --info: #38bdf8; --info-soft: rgba(56,189,248,.15);
      --shadow: 0 4px 18px rgba(0,0,0,.4);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); line-height: 1.45; min-height: 100vh; }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; border: none; background: none; }
    .hidden { display: none !important; }

    /* Layout & Cards */
    .container { max-width: 1240px; margin: 0 auto; padding: 1rem; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem; box-shadow: var(--shadow); }
    .flex { display: flex; align-items: center; gap: .6rem; }
    .between { justify-content: space-between; }
    .wrap { flex-wrap: wrap; }
    .grid-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: .8rem; margin-bottom: 1rem; }
    .grid-main { display: grid; grid-template-columns: 320px 1fr; gap: 1rem; align-items: start; }
    .kanban { display: grid; grid-template-columns: repeat(3, 1fr); gap: .8rem; margin-top: .8rem; }
    @media (max-width: 900px) { .grid-main, .kanban { grid-template-columns: 1fr; } }

    /* Buttons & Inputs */
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: .4rem; padding: .5rem .85rem; border-radius: 8px; font-weight: 600; font-size: .85rem; transition: .15s; min-height: 36px; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { filter: brightness(1.08); }
    .btn-sec { background: var(--subtle); border: 1px solid var(--border); }
    .btn-sec:hover { background: var(--hover); }
    .btn-danger { background: var(--err); color: #fff; }
    .btn-soft-danger { background: var(--err-soft); color: var(--err); }
    .btn-sm { padding: .3rem .6rem; font-size: .78rem; min-height: 28px; }
    .input { width: 100%; padding: .5rem .75rem; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; font-size: .88rem; }
    .input:focus { outline: none; border-color: var(--primary); }
    .field { margin-bottom: .75rem; }
    .field label { display: block; font-size: .8rem; font-weight: 600; color: var(--muted); margin-bottom: .25rem; }
    .err-msg { color: var(--err); font-size: .75rem; min-height: 1em; display: block; }

    /* Badges & Items */
    .badge { padding: .18rem .55rem; border-radius: 99px; font-size: .72rem; font-weight: 700; display: inline-block; }
    .b-primary { background: var(--primary-soft); color: var(--primary); }
    .b-ok { background: var(--ok-soft); color: var(--ok); }
    .b-warn { background: var(--warn-soft); color: var(--warn); }
    .b-err { background: var(--err-soft); color: var(--err); }
    .b-info { background: var(--info-soft); color: var(--info); }
    .b-neutral { background: var(--subtle); color: var(--muted); border: 1px solid var(--border); }

    /* Topbar & Auth */
    .topbar { background: var(--surface); border-bottom: 1px solid var(--border); padding: .75rem 1rem; position: sticky; top: 0; z-index: 20; }
    .auth-box { max-width: 400px; margin: 4vh auto; padding: 1.5rem; }
    .tabs { display: grid; grid-template-columns: 1fr 1fr; background: var(--subtle); padding: .2rem; border-radius: 8px; margin-bottom: 1rem; }
    .tab { padding: .45rem; border-radius: 6px; font-weight: 600; font-size: .85rem; color: var(--muted); }
    .tab.active { background: var(--surface); color: var(--primary); box-shadow: var(--shadow); }

    /* Project & Task Cards */
    .proj-item { padding: .75rem; border: 1px solid var(--border); border-radius: 8px; margin-bottom: .5rem; cursor: pointer; background: var(--subtle); transition: .15s; }
    .proj-item:hover, .proj-item.active { border-color: var(--primary); background: var(--primary-soft); }
    .col { background: var(--subtle); border: 1px solid var(--border); border-radius: var(--radius); padding: .7rem; min-height: 260px; }
    .col.drag-over { border: 2px dashed var(--primary); background: var(--primary-soft); }
    .task-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: .75rem; margin-top: .6rem; cursor: grab; box-shadow: var(--shadow); }
    .task-card.dragging { opacity: .45; }
    .task-card.done .t-title { text-decoration: line-through; color: var(--muted); }
    .att-chip { display: flex; align-items: center; justify-content: space-between; background: var(--subtle); border: 1px solid var(--border); padding: .3rem .5rem; border-radius: 6px; font-size: .75rem; margin-top: .5rem; gap: .4rem; }
    .att-chip img { width: 24px; height: 24px; object-fit: cover; border-radius: 4px; }
    .empty { text-align: center; padding: 2rem 1rem; color: var(--muted); border: 1px dashed var(--border); border-radius: var(--radius); font-size: .85rem; }

    /* Modal & Toast */
    .modal-bg { position: fixed; inset: 0; background: rgba(15,23,42,.55); display: flex; align-items: center; justify-content: center; padding: 1rem; z-index: 50; }
    .modal { width: 100%; max-width: 460px; max-height: 90vh; overflow-y: auto; }
    .toasts { position: fixed; bottom: 1rem; right: 1rem; z-index: 90; display: flex; flex-direction: column; gap: .5rem; max-width: 320px; }
    .toast { background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--primary); padding: .7rem .9rem; border-radius: 8px; box-shadow: var(--shadow); font-size: .82rem; }
    .toast.ok { border-left-color: var(--ok); } .toast.err { border-left-color: var(--err); } .toast.warn { border-left-color: var(--warn); }
  </style>
</head>
<body>

  <!-- AUTH VIEW -->
  <div id="authView" class="container">
    <div class="card auth-box">
      <div class="flex between" style="margin-bottom:1rem;">
        <div>
          <h2 style="font-size:1.3rem;">TaskFlow</h2>
          <small style="color:var(--muted);">Manajemen Proyek & Tugas Harian</small>
        </div>
        <button type="button" class="btn btn-sec btn-sm" data-action="toggle-theme">🌓 Tema</button>
      </div>
      <div class="tabs">
        <button type="button" class="tab active" data-auth-tab="login">Masuk</button>
        <button type="button" class="tab" data-auth-tab="register">Daftar</button>
      </div>
      <form id="loginForm" novalidate>
        <div class="field"><label>Email / Username *</label><input id="lUser" class="input" placeholder="demo@taskflow.id" /><span class="err-msg" id="eLUser"></span></div>
        <div class="field"><label>Kata Sandi *</label><input id="lPass" type="password" class="input" placeholder="******" /><span class="err-msg" id="eLPass"></span></div>
        <button type="submit" class="btn btn-primary" style="width:100%;">Masuk</button>
        <button type="button" class="btn btn-sec" style="width:100%;margin-top:.5rem;" data-action="demo-login">⚡ Masuk Akun Demo</button>
      </form>
      <form id="regForm" class="hidden" novalidate>
        <div class="field"><label>Nama Lengkap *</label><input id="rName" class="input" /><span class="err-msg" id="eRName"></span></div>
        <div class="field"><label>Username *</label><input id="rUser" class="input" /><span class="err-msg" id="eRUser"></span></div>
        <div class="field"><label>Email *</label><input id="rEmail" type="email" class="input" /><span class="err-msg" id="eREmail"></span></div>
        <div class="field"><label>Kata Sandi (min 6) *</label><input id="rPass" type="password" class="input" /><span class="err-msg" id="eRPass"></span></div>
        <button type="submit" class="btn btn-primary" style="width:100%;">Buat Akun</button>
      </form>
    </div>
  </div>

  <!-- APP VIEW -->
  <div id="appView" class="hidden">
    <header class="topbar">
      <div class="container flex between wrap" style="padding:0;">
        <div class="flex">
          <strong style="font-size:1.1rem;color:var(--primary);">TaskFlow</strong>
          <span class="badge b-neutral" id="userBadge">User</span>
        </div>
        <div class="flex wrap">
          <button type="button" class="btn btn-sec btn-sm" data-action="seed-data">+ Data Contoh</button>
          <button type="button" class="btn btn-primary btn-sm" data-action="open-proj-modal">+ Proyek</button>
          <button type="button" class="btn btn-sec btn-sm" data-action="toggle-theme">🌓</button>
          <button type="button" class="btn btn-soft-danger btn-sm" data-action="logout">Keluar</button>
        </div>
      </div>
    </header>
    <main class="container" id="appMain"></main>
  </div>

  <!-- MODAL PROYEK -->
  <div id="projModal" class="modal-bg hidden">
    <div class="card modal">
      <div class="flex between" style="margin-bottom:.8rem;">
        <h3 id="pmTitle">Tambah Proyek</h3>
        <button type="button" class="btn btn-sec btn-sm" data-close="projModal">✕</button>
      </div>
      <form id="projForm" novalidate>
        <input type="hidden" id="pId" />
        <div class="field"><label>Nama Proyek *</label><input id="pName" class="input" /><span class="err-msg" id="ePName"></span></div>
        <div class="field"><label>Deskripsi</label><textarea id="pDesc" class="input" rows="2"></textarea></div>
        <div class="flex">
          <div class="field" style="flex:1;"><label>Deadline *</label><input id="pDate" type="date" class="input" /><span class="err-msg" id="ePDate"></span></div>
          <div class="field" style="flex:1;"><label>Status</label><select id="pStatus" class="input"><option>Aktif</option><option>Ditunda</option><option>Selesai</option></select></div>
        </div>
        <div class="flex" style="justify-content:flex-end;">
          <button type="button" class="btn btn-sec" data-close="projModal">Batal</button>
          <button type="submit" class="btn btn-primary">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL TUGAS -->
  <div id="taskModal" class="modal-bg hidden">
    <div class="card modal">
      <div class="flex between" style="margin-bottom:.8rem;">
        <h3 id="tmTitle">Tambah Tugas</h3>
        <button type="button" class="btn btn-sec btn-sm" data-close="taskModal">✕</button>
      </div>
      <form id="taskForm" novalidate>
        <input type="hidden" id="tId" />
        <div class="field"><label>Proyek *</label><select id="tProj" class="input"></select></div>
        <div class="field"><label>Judul Tugas *</label><input id="tTitle" class="input" /><span class="err-msg" id="eTTitle"></span></div>
        <div class="field"><label>Deskripsi</label><textarea id="tDesc" class="input" rows="2"></textarea></div>
        <div class="flex">
          <div class="field" style="flex:1;"><label>Deadline *</label><input id="tDate" type="date" class="input" /><span class="err-msg" id="eTDate"></span></div>
          <div class="field" style="flex:1;"><label>Status</label><select id="tStatus" class="input"><option>To-do</option><option>In-Progress</option><option>Done</option></select></div>
        </div>
        <div class="field">
          <label>Lampiran File (Opsional, Maks 1.5MB)</label>
          <input id="tFile" type="file" class="input" />
          <span class="err-msg" id="eTFile"></span>
          <div id="tFilePreview"></div>
        </div>
        <div class="flex" style="justify-content:flex-end;">
          <button type="button" class="btn btn-sec" data-close="taskModal">Batal</button>
          <button type="submit" class="btn btn-primary">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL KONFIRMASI -->
  <div id="confirmModal" class="modal-bg hidden">
    <div class="card modal" style="max-width:380px;">
      <h3 style="margin-bottom:.5rem;">Konfirmasi Hapus</h3>
      <p id="confirmText" style="font-size:.88rem;color:var(--muted);margin-bottom:1rem;"></p>
      <div class="flex" style="justify-content:flex-end;">
        <button type="button" class="btn btn-sec" data-close="confirmModal">Batal</button>
        <button type="button" class="btn btn-danger" id="confirmOkBtn">Ya, Hapus</button>
      </div>
    </div>
  </div>

  <div id="toasts" class="toasts"></div>

  <script>
    (() => {
      const K = { U: "tf_u", S: "tf_s", P: "tf_p", T: "tf_t", TH: "tf_th" };
      const $ = (id) => document.getElementById(id);
      const get = (k, d = []) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
      const set = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { toast("Kuota storage penuh!", "err"); return false; } };
      const uid = (p) => `${p}_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`;
      const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
      const dayISO = (add = 0) => { const d = new Date(); d.setDate(d.getDate() + add); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };

      const st = { user: null, projId: null, search: "", status: "ALL", att: null, onConfirm: null, dragId: null };

      function toast(msg, type = "ok") {
        const el = document.createElement("div");
        el.className = `toast ${type}`;
        el.textContent = msg;
        $("toasts").appendChild(el);
        setTimeout(() => el.remove(), 3500);
      }

      function setTheme(th) {
        document.documentElement.dataset.theme = th;
        localStorage.setItem(K.TH, th);
      }
      setTheme(localStorage.getItem(K.TH) || "light");

      function dlBadge(date, done) {
        if (done) return `<span class="badge b-ok">Selesai • ${date}</span>`;
        const diff = Math.round((new Date(date + "T00:00:00") - new Date(dayISO() + "T00:00:00")) / 864e5);
        if (diff < 0) return `<span class="badge b-err">Telat ${Math.abs(diff)}h (${date})</span>`;
        if (diff <= 3) return `<span class="badge b-warn">H-${diff} (${date})</span>`;
        if (diff <= 7) return `<span class="badge b-info">H-${diff} (${date})</span>`;
        return `<span class="badge b-neutral">${date}</span>`;
      }

      function seedData(userId, silent = false) {
        const p1 = uid("p"), p2 = uid("p");
        set(K.P, [...get(K.P),
          { id: p1, userId, name: "Website Portofolio", description: "Desain responsif & optimasi SEO", deadline: dayISO(6), status: "Aktif" },
          { id: p2, userId, name: "Aplikasi Kasir UMKM", description: "Modul transaksi & laporan harian", deadline: dayISO(14), status: "Aktif" }
        ]);
        set(K.T, [...get(K.T),
          { id: uid("t"), userId, projectId: p1, title: "Buat Wireframe Halaman Utama", description: "Sketsa tata letak mobile & desktop", deadline: dayISO(1), status: "In-Progress", attachment: null },
          { id: uid("t"), userId, projectId: p1, title: "Slicing HTML & CSS Variables", description: "Terapkan dark mode", deadline: dayISO(3), status: "To-do", attachment: null },
          { id: uid("t"), userId, projectId: p1, title: "Setup Domain & Hosting", description: "Konfigurasi SSL", deadline: dayISO(-2), status: "Done", attachment: null },
          { id: uid("t"), userId, projectId: p2, title: "Desain Skema Database", description: "Tabel produk dan transaksi", deadline: dayISO(2), status: "To-do", attachment: null }
        ]);
        if (!silent) { toast("Data contoh berhasil dimuat"); render(); }
      }

      function guard() {
        const sid = localStorage.getItem(K.S);
        st.user = get(K.U).find((u) => u.id === sid) || null;
        $("authView").classList.toggle("hidden", !!st.user);
        $("appView").classList.toggle("hidden", !st.user);
        if (st.user) $("userBadge").textContent = st.user.name;
        return !!st.user;
      }

      function askConfirm(text, cb) {
        $("confirmText").textContent = text;
        st.onConfirm = cb;
        $("confirmModal").classList.remove("hidden");
      }

      function openProjModal(id = null) {
        $("projForm").reset(); $("ePName").textContent = ""; $("ePDate").textContent = "";
        const p = id ? get(K.P).find((x) => x.id === id) : null;
        $("pmTitle").textContent = p ? "Edit Proyek" : "Tambah Proyek";
        $("pId").value = p?.id || ""; $("pName").value = p?.name || "";
        $("pDesc").value = p?.description || ""; $("pDate").value = p?.deadline || dayISO(7);
        $("pStatus").value = p?.status || "Aktif";
        $("projModal").classList.remove("hidden");
      }

      function openTaskModal(id = null, defStatus = "To-do") {
        const projs = get(K.P).filter((p) => p.userId === st.user.id);
        if (!projs.length) { toast("Buat proyek terlebih dahulu", "warn"); return openProjModal(); }
        $("taskForm").reset(); $("eTTitle").textContent = ""; $("eTDate").textContent = ""; $("eTFile").textContent = "";
        $("tProj").innerHTML = projs.map((p) => `<option value="${esc(p.id)}">${esc(p.name)}</option>`).join("");
        const t = id ? get(K.T).find((x) => x.id === id) : null;
        $("tmTitle").textContent = t ? "Edit Tugas" : "Tambah Tugas";
        $("tId").value = t?.id || "";
        $("tProj").value = t?.projectId || st.projId || projs[0].id;
        $("tTitle").value = t?.title || ""; $("tDesc").value = t?.description || "";
        $("tDate").value = t?.deadline || dayISO(3); $("tStatus").value = t?.status || defStatus;
        st.att = t?.attachment ? { ...t.attachment } : null;
        renderAttPreview();
        $("taskModal").classList.remove("hidden");
      }

      function renderAttPreview() {
        $("tFilePreview").innerHTML = st.att ? `
          <div class="att-chip">
            <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">📎 ${esc(st.att.name)}</span>
            <button type="button" class="btn btn-soft-danger btn-sm" data-action="clear-att">Hapus</button>
          </div>` : "";
      }

      function render() {
        if (!guard()) return;
        const projs = get(K.P).filter((p) => p.userId === st.user.id);
        const tasks = get(K.T).filter((t) => t.userId === st.user.id);
        if (!projs.some((p) => p.id === st.projId)) st.projId = projs[0]?.id || null;
        const activeProj = projs.find((p) => p.id === st.projId) || null;

        const cnt = (s) => tasks.filter((t) => t.status === s).length;
        const urgent = tasks.filter((t) => t.status !== "Done" && Math.round((new Date(t.deadline + "T00:00:00") - new Date(dayISO() + "T00:00:00")) / 864e5) <= 7)
          .sort((a, b) => a.deadline.localeCompare(b.deadline));

        const projTasks = activeProj ? tasks.filter((t) => t.projectId === activeProj.id &&
          (st.status === "ALL" || t.status === st.status) &&
          (t.title.toLowerCase().includes(st.search.toLowerCase()) || (t.description || "").toLowerCase().includes(st.search.toLowerCase()))) : [];

        $("appMain").innerHTML = `
          <!-- DASHBOARD RINGKAS -->
          <div class="grid-stats">
            <div class="card"><small style="color:var(--muted)">Total Proyek</small><h2>${projs.length}</h2></div>
            <div class="card"><small style="color:var(--info)">To-do</small><h2>${cnt("To-do")}</h2></div>
            <div class="card"><small style="color:var(--warn)">In-Progress</small><h2>${cnt("In-Progress")}</h2></div>
            <div class="card"><small style="color:var(--ok)">Done</small><h2>${cnt("Done")}</h2></div>
          </div>

          <!-- DEADLINE DEKAT -->
          <div class="card" style="margin-bottom:1rem;">
            <strong style="font-size:.9rem;">⏰ Tugas Mendekati Deadline (≤ 7 Hari / Terlambat)</strong>
            <div class="flex wrap" style="margin-top:.6rem;">
              ${urgent.length ? urgent.map((t) => {
                const p = projs.find((x) => x.id === t.projectId);
                return `<button type="button" class="btn btn-sec btn-sm" data-select-proj="${esc(t.projectId)}">
                  <strong>${esc(t.title)}</strong> <span style="color:var(--muted)">(${esc(p?.name || "-")})</span> ${dlBadge(t.deadline, false)}
                </button>`;
              }).join("") : `<span style="font-size:.82rem;color:var(--muted);">Tidak ada tugas mendesak saat ini.</span>`}
            </div>
          </div>

          <!-- MANAJEMEN PROYEK & KANBAN TUGAS -->
          <div class="grid-main">
            <div class="card">
              <div class="flex between" style="margin-bottom:.75rem;">
                <strong>Daftar Proyek (${projs.length})</strong>
                <button type="button" class="btn btn-primary btn-sm" data-action="open-proj-modal">+ Baru</button>
              </div>
              ${projs.length ? projs.map((p) => {
                const pt = tasks.filter((t) => t.projectId === p.id);
                const dn = pt.filter((t) => t.status === "Done").length;
                return `<div class="proj-item ${p.id === st.projId ? "active" : ""}" data-select-proj="${esc(p.id)}">
                  <div class="flex between"><strong>${esc(p.name)}</strong><span class="badge b-primary">${esc(p.status)}</span></div>
                  <p style="font-size:.78rem;color:var(--muted);margin:.25rem 0;">${esc(p.description || "Tanpa deskripsi")}</p>
                  <div class="flex between wrap" style="margin-top:.4rem;">
                    <small>${dn}/${pt.length} selesai • ${p.deadline}</small>
                    <div class="flex" style="gap:.25rem;">
                      <button type="button" class="btn btn-sec btn-sm" data-edit-proj="${esc(p.id)}">Edit</button>
                      <button type="button" class="btn btn-soft-danger btn-sm" data-del-proj="${esc(p.id)}">Hapus</button>
                    </div>
                  </div>
                </div>`;
              }).join("") : `<div class="empty">Belum ada proyek.<br/><button type="button" class="btn btn-primary btn-sm" style="margin-top:.5rem;" data-action="open-proj-modal">+ Buat Proyek</button></div>`}
            </div>

            <div class="card">
              ${activeProj ? `
                <div class="flex between wrap" style="margin-bottom:.75rem;">
                  <div>
                    <h3>${esc(activeProj.name)}</h3>
                    <small style="color:var(--muted);">${esc(activeProj.description || "")} • Deadline: ${activeProj.deadline}</small>
                  </div>
                  <button type="button" class="btn btn-primary btn-sm" data-action="open-task-modal">+ Tambah Tugas</button>
                </div>
                <div class="flex wrap">
                  <input id="searchTask" class="input" style="max-width:240px;" placeholder="Cari judul/deskripsi tugas..." value="${esc(st.search)}" />
                  <select id="filterStatus" class="input" style="max-width:150px;">
                    <option value="ALL" ${st.status === "ALL" ? "selected" : ""}>Semua Status</option>
                    <option value="To-do" ${st.status === "To-do" ? "selected" : ""}>To-do</option>
                    <option value="In-Progress" ${st.status === "In-Progress" ? "selected" : ""}>In-Progress</option>
                    <option value="Done" ${st.status === "Done" ? "selected" : ""}>Done</option>
                  </select>
                </div>
                <div class="kanban">
                  ${["To-do", "In-Progress", "Done"].map((col) => {
                    const list = projTasks.filter((t) => t.status === col);
                    return `<div class="col" data-drop-col="${col}">
                      <div class="flex between">
                        <strong style="font-size:.85rem;">${col} (${list.length})</strong>
                        <button type="button" class="btn btn-sec btn-sm" data-quick-task="${col}">+</button>
                      </div>
                      ${list.length ? list.map((t) => `
                        <div class="task-card ${t.status === "Done" ? "done" : ""}" draggable="true" data-task-id="${esc(t.id)}">
                          <div class="flex between" style="align-items:flex-start;">
                            <strong class="t-title" style="font-size:.88rem;">${esc(t.title)}</strong>
                            <div class="flex" style="gap:.2rem;">
                              <button type="button" class="btn btn-sec btn-sm" data-edit-task="${esc(t.id)}">✎</button>
                              <button type="button" class="btn btn-soft-danger btn-sm" data-del-task="${esc(t.id)}">✕</button>
                            </div>
                          </div>
                          ${t.description ? `<p style="font-size:.78rem;color:var(--muted);margin-top:.25rem;">${esc(t.description)}</p>` : ""}
                          ${t.attachment ? `<div class="att-chip">
                            <div class="flex" style="min-width:0;">
                              ${t.attachment.type?.startsWith("image/") ? `<img src="${t.attachment.dataUrl}" alt="" />` : "📎"}
                              <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(t.attachment.name)}</span>
                            </div>
                            <a href="${t.attachment.dataUrl}" download="${esc(t.attachment.name)}" class="btn btn-sec btn-sm" style="text-decoration:none;">Unduh</a>
                          </div>` : ""}
                          <div class="flex between wrap" style="margin-top:.55rem;">
                            ${dlBadge(t.deadline, t.status === "Done")}
                            <select class="input" style="width:auto;padding:.2rem .4rem;font-size:.75rem;" data-move-task="${esc(t.id)}">
                              ${["To-do", "In-Progress", "Done"].map((s) => `<option ${t.status === s ? "selected" : ""}>${s}</option>`).join("")}
                            </select>
                          </div>
                        </div>`).join("") : `<div class="empty" style="margin-top:.6rem;padding:1rem;">Kosong</div>`}
                    </div>`;
                  }).join("")}
                </div>
              ` : `<div class="empty">Pilih atau buat proyek di panel kiri untuk mulai mengelola tugas.</div>`}
            </div>
          </div>`;
      }

      /* GLOBAL EVENT DELEGATION */
      document.addEventListener("click", (e) => {
        const el = e.target.closest("[data-action],[data-auth-tab],[data-close],[data-select-proj],[data-edit-proj],[data-del-proj],[data-quick-task],[data-edit-task],[data-del-task]");
        if (!el) return;

        if (el.dataset.authTab) {
          document.querySelectorAll("[data-auth-tab]").forEach((t) => t.classList.toggle("active", t === el));
          $("loginForm").classList.toggle("hidden", el.dataset.authTab !== "login");
          $("regForm").classList.toggle("hidden", el.dataset.authTab !== "register");
        }
        if (el.dataset.close) $(el.dataset.close).classList.add("hidden");
        if (el.dataset.action === "toggle-theme") setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
        if (el.dataset.action === "demo-login") {
          let users = get(K.U), demo = users.find((u) => u.email === "demo@taskflow.id");
          if (!demo) {
            demo = { id: "u_demo", name: "Budi (Demo)", username: "demo", email: "demo@taskflow.id", password: "password123" };
            set(K.U, [...users, demo]); seedData(demo.id, true);
          }
          localStorage.setItem(K.S, demo.id); toast("Masuk sebagai Akun Demo"); render();
        }
        if (el.dataset.action === "logout") { localStorage.removeItem(K.S); st.user = null; guard(); toast("Anda telah keluar"); }
        if (el.dataset.action === "seed-data" && st.user) seedData(st.user.id);
        if (el.dataset.action === "open-proj-modal") openProjModal();
        if (el.dataset.action === "open-task-modal") openTaskModal();
        if (el.dataset.action === "clear-att") { st.att = null; $("tFile").value = ""; renderAttPreview(); }

        if (el.dataset.editProj) { e.stopPropagation(); openProjModal(el.dataset.editProj); return; }
        if (el.dataset.delProj) {
          e.stopPropagation();
          const pid = el.dataset.delProj;
          askConfirm("Hapus proyek ini beserta seluruh tugas di dalamnya?", () => {
            set(K.P, get(K.P).filter((p) => p.id !== pid));
            set(K.T, get(K.T).filter((t) => t.projectId !== pid));
            toast("Proyek & tugas terkait dihapus", "warn"); render();
          });
          return;
        }
        if (el.dataset.selectProj) { st.projId = el.dataset.selectProj; render(); }
        if (el.dataset.quickTask) openTaskModal(null, el.dataset.quickTask);
        if (el.dataset.editTask) openTaskModal(el.dataset.editTask);
        if (el.dataset.delTask) {
          const tid = el.dataset.delTask;
          askConfirm("Hapus tugas ini secara permanen?", () => {
            set(K.T, get(K.T).filter((t) => t.id !== tid));
            toast("Tugas dihapus", "warn"); render();
          });
        }
      });

      $("confirmOkBtn").addEventListener("click", () => {
        $("confirmModal").classList.add("hidden");
        if (st.onConfirm) { st.onConfirm(); st.onConfirm = null; }
      });

      /* INPUT, FILTER, FILE & DRAG-DROP EVENTS */
      document.addEventListener("input", (e) => {
        if (e.target.id === "searchTask") {
          st.search = e.target.value; render();
          const inp = $("searchTask"); if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
        }
      });

      document.addEventListener("change", (e) => {
        if (e.target.id === "filterStatus") { st.status = e.target.value; render(); }
        if (e.target.dataset.moveTask) {
          const tasks = get(K.T);
          const t = tasks.find((x) => x.id === e.target.dataset.moveTask);
          if (t) { t.status = e.target.value; set(K.T, tasks); toast(`Status diubah ke ${t.status}`); render(); }
        }
        if (e.target.id === "tFile") {
          const f = e.target.files[0]; $("eTFile").textContent = "";
          if (!f) return;
          if (f.size > 1.5 * 1024 * 1024) { $("eTFile").textContent = "Ukuran file maksimal 1.5 MB!"; e.target.value = ""; return; }
          const r = new FileReader();
          r.onload = (ev) => { st.att = { name: f.name, type: f.type, dataUrl: ev.target.result }; renderAttPreview(); };
          r.readAsDataURL(f);
        }
      });

      document.addEventListener("dragstart", (e) => {
        const card = e.target.closest(".task-card");
        if (card) { st.dragId = card.dataset.taskId; card.classList.add("dragging"); }
      });
      document.addEventListener("dragend", (e) => {
        const card = e.target.closest(".task-card");
        if (card) card.classList.remove("dragging");
        document.querySelectorAll(".col").forEach((c) => c.classList.remove("drag-over"));
      });
      document.addEventListener("dragover", (e) => {
        const col = e.target.closest(".col");
        if (col) { e.preventDefault(); col.classList.add("drag-over"); }
      });
      document.addEventListener("dragleave", (e) => {
        const col = e.target.closest(".col");
        if (col && !col.contains(e.relatedTarget)) col.classList.remove("drag-over");
      });
      document.addEventListener("drop", (e) => {
        const col = e.target.closest(".col");
        if (!col || !st.dragId) return;
        e.preventDefault(); col.classList.remove("drag-over");
        const tasks = get(K.T), t = tasks.find((x) => x.id === st.dragId);
        if (t && t.status !== col.dataset.dropCol) {
          t.status = col.dataset.dropCol; set(K.T, tasks); toast(`Dipindahkan ke ${t.status}`); render();
        }
        st.dragId = null;
      });

      /* FORM SUBMISSIONS (AUTH, PROJECT, TASK) */
      $("loginForm").addEventListener("submit", (e) => {
        e.preventDefault();
        const u = $("lUser").value.trim(), p = $("lPass").value;
        $("eLUser").textContent = u ? "" : "Wajib diisi"; $("eLPass").textContent = p ? "" : "Wajib diisi";
        if (!u || !p) return;
        const found = get(K.U).find((x) => (x.email === u || x.username === u) && x.password === p);
        if (!found) { $("eLPass").textContent = "Akun atau kata sandi salah"; return toast("Login gagal", "err"); }
        localStorage.setItem(K.S, found.id); toast(`Selamat datang, ${found.name}`); render();
      });

      $("regForm").addEventListener("submit", (e) => {
        e.preventDefault();
        const name = $("rName").value.trim(), username = $("rUser").value.trim(), email = $("rEmail").value.trim(), password = $("rPass").value;
        const users = get(K.U);
        $("eRName").textContent = name.length < 2 ? "Min 2 karakter" : "";
        $("eRUser").textContent = username.length < 3 ? "Min 3 karakter" : users.some((x) => x.username === username) ? "Sudah dipakai" : "";
        $("eREmail").textContent = !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email) ? "Email tidak valid" : users.some((x) => x.email === email) ? "Sudah terdaftar" : "";
        $("eRPass").textContent = password.length < 6 ? "Min 6 karakter" : "";
        if ($("eRName").textContent || $("eRUser").textContent || $("eREmail").textContent || $("eRPass").textContent) return;
        const nu = { id: uid("u"), name, username, email, password };
        set(K.U, [...users, nu]); localStorage.setItem(K.S, nu.id);
        $("regForm").reset(); toast("Registrasi berhasil!"); render();
      });

      $("projForm").addEventListener("submit", (e) => {
        e.preventDefault();
        const id = $("pId").value, name = $("pName").value.trim(), description = $("pDesc").value.trim(), deadline = $("pDate").value, status = $("pStatus").value;
        $("ePName").textContent = name ? "" : "Nama proyek wajib diisi";
        $("ePDate").textContent = deadline ? "" : "Deadline wajib diisi";
        if (!name || !deadline) return;
        const list = get(K.P);
        if (id) {
          const idx = list.findIndex((x) => x.id === id);
          if (idx > -1) list[idx] = { ...list[idx], name, description, deadline, status };
        } else {
          const nid = uid("p");
          list.unshift({ id: nid, userId: st.user.id, name, description, deadline, status });
          st.projId = nid;
        }
        set(K.P, list); $("projModal").classList.add("hidden"); toast(id ? "Proyek diperbarui" : "Proyek ditambahkan"); render();
      });

      $("taskForm").addEventListener("submit", (e) => {
        e.preventDefault();
        const id = $("tId").value, projectId = $("tProj").value, title = $("tTitle").value.trim(), description = $("tDesc").value.trim(), deadline = $("tDate").value, status = $("tStatus").value;
        $("eTTitle").textContent = title ? "" : "Judul tugas wajib diisi";
        $("eTDate").textContent = deadline ? "" : "Deadline wajib diisi";
        if (!title || !deadline) return;
        const list = get(K.T);
        if (id) {
          const idx = list.findIndex((x) => x.id === id);
          if (idx > -1) list[idx] = { ...list[idx], projectId, title, description, deadline, status, attachment: st.att };
        } else {
          list.unshift({ id: uid("t"), userId: st.user.id, projectId, title, description, deadline, status, attachment: st.att });
        }
        if (set(K.T, list)) {
          st.projId = projectId; $("taskModal").classList.add("hidden");
          toast(id ? "Tugas diperbarui" : "Tugas ditambahkan"); render();
        }
      });

      if (guard()) render();
    })();
  </script>
</body>
</html>
